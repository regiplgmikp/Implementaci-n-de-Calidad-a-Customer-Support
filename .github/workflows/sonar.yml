name: SonarQube Analysis

on:
  # Disparadores: Cuándo se ejecuta esta acción
  push:
    branches:
      - main
      - develop
      - 'feature/**' # Se ejecuta en cualquier rama feature/algo
      - 'fix/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar-scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    
    steps:
      # PASO 1: Descargar tu código en el entorno virtual de GitHub
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # IMPORTANTE: Desactiva la clonación superficial para que SonarQube pueda analizar el historial completo y detectar "Código Nuevo"

      # PASO 2: Preparar Python (necesario para correr los tests antes del análisis)
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # PASO 3: Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # PASO 4: Ejecutar Pruebas y Generar Reporte de Cobertura
      # SonarQube NO ejecuta las pruebas, solo LEE el reporte. Por eso debemos generarlo aquí.
      - name: Run Tests with Coverage
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml

      # PASO 5: Escaneo de SonarQube
      # Aquí se conecta con tu Ngrok usando los secretos
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}