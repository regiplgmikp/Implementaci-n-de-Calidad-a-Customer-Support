name: SonarQube Analysis

on:
  push:
    branches:
      - '**'  # Ejecutar en todas las ramas (incluyendo ImplementacionControlada)
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      # 1. Obtener código (Igual que PDF pag 20)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # CRÍTICO: Necesario para el análisis correcto 

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Generar Reporte de Cobertura (Esto NO estaba en el PDF, pero lo necesitas hoy)
      - name: Run Tests with Coverage
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest tests/ --cov=src --cov-report=xml:coverage.xml --cov-report=term

      # 5. Escáner de Sonar (Igual que PDF pag 20)
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}