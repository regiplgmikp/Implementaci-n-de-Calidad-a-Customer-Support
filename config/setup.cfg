[flake8]
# PEP 8 permite hasta 79, pero en proyectos modernos 120 es aceptable.
max-line-length = 120
exclude = .git,__pycache__,venv,.env,build,dist
# Ignorar errores menores si es necesario (ej: E203 whitespace before ':')
extend-ignore = E203

[tool:pytest]
testpaths = tests
# Solo archivos que empiecen con test_
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Output detallado y generación de reporte de cobertura para Sonar
addopts = -v --cov=src --cov-report=xml:coverage.xml --cov-report=term